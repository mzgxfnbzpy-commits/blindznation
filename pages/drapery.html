<title>Custom Drapery &amp; Hardware — Blindznation | Salt Lake City &amp; Philadelphia</title>
<link rel="stylesheet" href="../css/global.css">
<style>
.page-hero{background:var(--espresso);padding:44px 28px 40px}
.breadcrumb{font-size:11px;color:var(--text-faint);margin-bottom:14px}
.breadcrumb a{color:var(--text-muted);text-decoration:none}
.breadcrumb a:hover{color:var(--cream)}
.page-hero h1{font-size:32px;font-weight:500;color:var(--cream);letter-spacing:-0.5px;margin-bottom:10px;line-height:1.2}
.page-hero .sub{font-size:14px;color:var(--text-dark);line-height:1.7;max-width:520px;margin-bottom:20px}
.hero-trust{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hero-trust a{font-size:14px;font-weight:500;color:var(--gold);text-decoration:none}
.hero-trust-badge{font-size:11px;color:var(--text-faint);padding:5px 12px;border:0.5px solid var(--border-dark);border-radius:20px}

/* ── TAB SWITCHER ── */
.page-tabs-wrap{background:var(--espresso-mid);border-bottom:1px solid var(--border-dark);padding:0 28px;position:sticky;top:56px;z-index:90}
.page-tabs{display:flex;gap:0}
.page-tab{padding:15px 28px;font-size:13px;font-weight:500;color:var(--text-muted);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;transition:color .15s,border-color .15s;letter-spacing:.2px;font-family:inherit}
.page-tab:hover{color:var(--cream)}
.page-tab.active{color:var(--cream);border-bottom-color:var(--gold)}

/* ── STEP HEADERS ── */
.step-header{margin-bottom:24px}
.step-num{font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;font-weight:500;margin-bottom:5px}
.step-title{font-size:20px;font-weight:500;letter-spacing:-0.3px;color:#1a1a1a}
.step-title-light{font-size:20px;font-weight:500;letter-spacing:-0.3px;color:var(--cream)}
.step-sub{font-size:13px;color:#666;margin-top:4px;line-height:1.6}
.step-sub-light{font-size:13px;color:var(--text-dark);margin-top:4px;line-height:1.6}

/* ── STYLE / HARDWARE TYPE CARDS ── */
.style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;margin-top:20px}
.hw-type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;margin-top:20px}
.style-card{background:#fff;border:1.5px solid #e8e8e4;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.style-card:hover{border-color:var(--gold);box-shadow:0 2px 12px rgba(201,169,110,.12)}
.style-card.sel{border:2px solid var(--gold);box-shadow:0 2px 16px rgba(201,169,110,.2)}
.style-card.sel .style-label-bar{background:var(--gold)}
.style-card.sel .style-name{color:var(--espresso)}
.style-card.sel .style-desc{color:var(--espresso)}
.style-img-wrap{height:150px;overflow:hidden;background:#F8F4EE}
.style-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.hw-ph-wrap{height:150px;background:#F0EDE8;display:flex;align-items:center;justify-content:center}
.style-svg-wrap{background:#F8F4EE;padding:18px;display:flex;align-items:center;justify-content:center;height:114px}
.style-label-bar{background:#f2ede6;padding:12px 14px;transition:background .15s}
.style-name{font-size:13px;font-weight:500;color:#222;margin-bottom:2px}
.style-desc{font-size:11px;color:#888;line-height:1.4}

/* ── FABRIC CARDS ── */
.fabric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:20px}
.fabric-card{background:#fff;border:1.5px solid #e8e8e4;border-radius:12px;padding:22px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.fabric-card:hover{border-color:var(--gold);box-shadow:0 2px 12px rgba(201,169,110,.1)}
.fabric-card.sel{border:2px solid var(--gold);background:var(--gold-mid)}
.fabric-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.fabric-icon-gold{background:rgba(201,169,110,.15)}
.fabric-icon-cream{background:rgba(245,236,215,.6)}
.fabric-icon-soft{background:#EFF5E8}
.fabric-card h3{font-size:14px;font-weight:500;color:#111;margin-bottom:4px}
.fabric-card p{font-size:12px;color:#666;line-height:1.5}
.fabric-card a{font-size:12px;color:var(--gold);font-weight:500;text-decoration:none;display:inline-block;margin-top:6px}
.fabric-card.sel h3{color:var(--espresso)}

/* ── HARDWARE FORM ── */
.hardware-brands{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.brand-pill{padding:6px 14px;border:1px solid #ddd;border-radius:20px;font-size:12px;color:#555;background:#fff;cursor:default}
.brand-pill-more{padding:6px 14px;border:1px dashed #ccc;border-radius:20px;font-size:12px;color:#999;background:#fafafa}
.hw-form{background:#fff;border:1px solid #e8e8e4;border-radius:12px;padding:24px}
.hw-form-label{font-size:12px;font-weight:500;color:#444;margin-bottom:8px;display:block}
.hw-section{margin-bottom:20px}

/* ── QUOTE BOX ── */
.quote-box{background:var(--espresso-mid);border:0.5px solid var(--border-dark);border-radius:14px;padding:24px;position:sticky;top:110px}
.quote-box-head{font-size:11px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;font-weight:500;margin-bottom:16px}
.quote-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:0.5px solid var(--border-dark)}
.quote-row:last-of-type{border-bottom:none}
.quote-key{font-size:11px;color:var(--text-faint);white-space:nowrap}
.quote-val{font-size:12px;color:var(--cream);text-align:right;line-height:1.4}
.quote-note{font-size:11px;color:var(--text-faint);margin-top:14px;line-height:1.6;padding-top:14px;border-top:0.5px solid var(--border-dark)}

/* ── LAYOUT ── */
.two-col{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start}
.contact-form-wrap{background:#fff;border:1px solid #e8e8e4;border-radius:12px;padding:28px}
.success-box{display:none;background:#EAF3DE;border-radius:12px;padding:32px;text-align:center}
.success-box h3{font-size:18px;font-weight:500;color:#27500A;margin-bottom:8px}
.success-box p{font-size:13px;color:#3B6D11;line-height:1.6;margin-bottom:16px}
.win-dimensions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.measure-hint{font-size:12px;color:var(--text-muted);margin-top:-6px;margin-bottom:14px;line-height:1.5}
.measure-hint a{color:var(--gold);text-decoration:none;font-weight:500}
.type-btn{padding:9px 16px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;cursor:pointer;background:#fff;color:#333;font-family:var(--font);transition:all .12s;text-align:center}
.type-btn:hover{border-color:var(--gold)}
.type-btn.sel{border:2px solid var(--gold);color:#0A4A42;font-weight:500;background:var(--gold-mid)}
.type-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}

/* ── CROSS-SELL PROMPT ── */
.xsell-wrap{background:var(--espresso);border:1px solid var(--border-dark);border-radius:14px;padding:24px;margin-top:8px}
.xsell-head{font-size:15px;font-weight:500;color:var(--cream);margin-bottom:6px}
.xsell-sub{font-size:12px;color:var(--text-dark);margin-bottom:16px;line-height:1.6}
.xsell-btns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:0}
.xsell-btn{padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .12s;border:1.5px solid}
.xsell-btn-yes{background:var(--gold);color:var(--espresso);border-color:var(--gold)}
.xsell-btn-no{background:transparent;color:var(--text-muted);border-color:var(--border-dark)}
.xsell-btn-no:hover{border-color:var(--text-muted);color:var(--cream)}

/* ── MEASUREMENT CHOICE ── */
.measure-choice-wrap{margin-top:20px}
.measure-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.measure-choice-card{background:#fff;border:1.5px solid #e8e8e4;border-radius:12px;padding:20px;cursor:pointer;transition:border-color .15s,box-shadow .15s;text-align:center}
.measure-choice-card:hover{border-color:var(--gold);box-shadow:0 2px 10px rgba(201,169,110,.1)}
.measure-choice-card.sel{border:2px solid var(--gold);background:var(--gold-mid)}
.measure-choice-icon{font-size:28px;margin-bottom:8px}
.measure-choice-title{font-size:14px;font-weight:500;color:#111;margin-bottom:4px}
.measure-choice-desc{font-size:11px;color:#666;line-height:1.5}

@media(max-width:900px){.two-col{grid-template-columns:1fr}.quote-box{position:static}}
@media(max-width:640px){.measure-choice-grid{grid-template-columns:1fr}}
@media(max-width:600px){.style-grid,.hw-type-grid{grid-template-columns:repeat(2,1fr)}.fabric-grid{grid-template-columns:1fr}.page-hero h1{font-size:24px}}
</style>
</head>
