<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1C1510"/>

  <!-- Gold left bar -->
  <rect width="8" height="630" fill="#C8973F"/>

  <!-- Decorative teal brand curve (large, faint) -->
  <g transform="translate(790,80) scale(2.4)" opacity="0.14">
    <path d="M20 130 C60 140,120 50,200 20 C230 8,255 12,265 30 C275 48,260 68,238 62 C220 58,215 68,240 72 C260 76,270 90,250 110 C230 130,200 128,180 115"
          stroke="#2DE0C1" stroke-width="22" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Decorative teal brand curve (medium, fainter) -->
  <g transform="translate(860,310) scale(1.5)" opacity="0.08">
    <path d="M20 130 C60 140,120 50,200 20 C230 8,255 12,265 30 C275 48,260 68,238 62 C220 58,215 68,240 72 C260 76,270 90,250 110 C230 130,200 128,180 115"
          stroke="#2DE0C1" stroke-width="22" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Brand: Blindz -->
  <text x="80" y="215"
        font-family="system-ui,-apple-system,Helvetica Neue,Arial,sans-serif"
        font-size="100" font-weight="700" letter-spacing="-2" fill="#F5ECD7">Blindz</text>

  <!-- Brand: nation (gold, italic) -->
  <text x="80" y="316"
        font-family="Georgia,Times New Roman,serif"
        font-size="100" font-weight="400" font-style="italic" letter-spacing="-1" fill="#C8973F">nation</text>

  <!-- Gold rule -->
  <rect x="80" y="344" width="280" height="4" rx="2" fill="#C8973F"/>

  <!-- Subtitle -->
  <text x="80" y="400"
        font-family="system-ui,-apple-system,Helvetica Neue,Arial,sans-serif"
        font-size="30" font-weight="400" fill="#A89880">Custom Window Treatments</text>

  <!-- Service area -->
  <text x="80" y="450"
        font-family="system-ui,-apple-system,Helvetica Neue,Arial,sans-serif"
        font-size="23" font-weight="400" fill="#6A5A4A">Salt Lake City  ·  Philadelphia  ·  Nationwide</text>

  <!-- Company name -->
  <text x="80" y="492"
        font-family="system-ui,-apple-system,Helvetica Neue,Arial,sans-serif"
        font-size="19" font-weight="400" fill="#4A3A2A">Michael J. Healy Installations LLC</text>

  <!-- Phone -->
  <text x="80" y="548"
        font-family="system-ui,-apple-system,Helvetica Neue,Arial,sans-serif"
        font-size="30" font-weight="600" fill="#C8973F">(609) 742-1720  ·  24/7</text>

  <!-- URL -->
  <text x="80" y="593"
        font-family="system-ui,-apple-system,Helvetica Neue,Arial,sans-serif"
        font-size="21" font-weight="400" fill="#5A4A3A">blindznation.com</text>

  <!-- Bottom gold-to-teal gradient bar -->
  <defs>
    <linearGradient id="btmGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8973F"/>
      <stop offset="55%" stop-color="#2DE0C1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1C1510" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="616" width="1200" height="8" rx="0" fill="url(#btmGrad)"/>
</svg>
