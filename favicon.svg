<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Onyx background -->
  <rect width="32" height="32" rx="6" fill="#111110"/>
  <!-- Champagne gold left accent bar -->
  <rect x="0" y="0" width="4" height="32" rx="2" fill="#C9A96E"/>
  <!-- B — cream -->
  <text x="8" y="23" font-family="system-ui,-apple-system,Arial,sans-serif" font-size="18" font-weight="700" fill="#F5ECD7" letter-spacing="-1">B</text>
  <!-- Z — gold -->
  <text x="19" y="23" font-family="system-ui,-apple-system,Arial,sans-serif" font-size="18" font-weight="700" fill="#C9A96E" letter-spacing="-1">Z</text>
</svg>
